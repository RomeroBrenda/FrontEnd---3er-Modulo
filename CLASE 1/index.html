<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercitacion 1</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>

<body>

    <h2>Actividad 2: Creación y Eliminación</h2>
    <div id="contenedor"></div>

    <button id="btn-agregar">Agregar Parrafo</button>
    <button id="btn-eliminar">Eliminar Ultimo Parrafo</button>

    <div class="seccion-cambiar-color">
        <h2>Actividad 3: Cambio de Estilos</h2>
        <button id="btn-color">Cambiar Color de Fondo</button>
    </div>

    <div class="seccion-actividad-4">
        <h2>Actividad 4: Búsqueda en el DOM</h2>

        <ul id="lista-nombres">
            <li>Ana</li>
            <li class="destacado">Beto</li>
            <li>Carla</li>
            <li class="destacado">Dani</li>
            <li>Ezequiel</li>
            <li class="destacado">Fabián</li>
        </ul>

        <button id="btn-destacar">Destacar Nombres</button>
    </div>

    <div class="seccion-actividad-5">
        <h2>Actividad 5: Manipulación de Atributos</h2>

        <img id="mi-imagen" src="imagen_original.jpg" alt="Imagen Original" width="200">

        <button id="btn-cambiar-imagen">Cambiar Imagen</button>
    </div>

    <script src="app.js"></script>

</body>

</html>
