<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 5 | Tarjetas Dinamicas</title>
    <link rel="stylesheet" href="styles/styles_5.css">
</head>
<body>

    <main>

        <h1>Actividad 5: Generador de Tarjetas Dinamicas</h1>
        <p class="instruccion">Completa los campos y haz clic en "Crear Tarjeta" para generar contenido dinámico.</p>

         <!-- Formulario de Creación de Tarjeta -->
        <div class="formulario-tarjeta">
            <label for="input-tarjeta-nombre">Título de la Tarjeta: </label>
            <input type="text" id="input-tarjeta-nombre" placeholder="Ej: Mi primera tarjeta" required>

            <label for="input-tarjeta-descripcion">Descripción o Contenido: </label>
            <textarea id="input-tarjeta-descripcion" placeholder="Describe brevemente el contenido de esta tarjeta: " rows="3" required></textarea>

            <button id="btn-crear-tarjeta">Crear Tarjeta</button>
        </div>

        <h2>Tarjetas Creadas</h2>
        <div id="contenedor-tarjetas"></div>

    </main>

    
    <script src="app_5.js"></script>
</body>
</html>
